<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Список справ</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fb;padding:16px}
.box{max-width:800px;margin:auto;background:white;border-radius:16px;padding:20px}
h1{text-align:center}
.form{display:flex;flex-wrap:wrap;gap:8px}
input,select,button{padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}
input{flex:1;min-width:140px}
button{background:#6c5ce7;color:white;border:none;cursor:pointer}
.card{display:flex;justify-content:space-between;align-items:center;background:#f9f9ff;padding:12px;border-radius:12px;margin-top:10px;gap:10px}
.done{text-decoration:line-through;opacity:.6}
@media(max-width:600px){.box{padding:12px}.form{flex-direction:column}input,select,button{width:100%}.card{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="box">
<h1>📋 Список справ</h1>
<div class="form">
<input id="nazva" placeholder="Що треба зробити?">
<input id="data" type="date">
<select id="vazhlyvist"><option>Важливо</option><option>Середнє</option><option>Неважливо</option></select>
<select id="skladnist"><option>Легке</option><option>Середнє</option><option>Складне</option></select>
<select id="sesiya"><option>Сесія</option><option>Навчання</option><option>Особисте</option></select>
<button onclick="Backend.dodaty()">+ Додати</button>
</div>
<div id="spysok"></div>
</div>
<script src="backend.js"></script>
<script>
const Frontend={show(){document.getElementById('spysok').innerHTML=Backend.data.map((z,i)=>`<div class="card"><span class="${z.zrobleno?'done':''}">${z.nazva} - ${z.data} - ${z.vazhlyvist} - ${z.skladnist} - ${z.sesiya}</span><div><button onclick="Backend.toggle(${i})">✓</button> <button onclick="Backend.del(${i})">🗑️</button></div></div>`).join('')||'<p style="text-align:center">Поки порожньо</p>';}};
Frontend.show();
</script>
</body>
</html>
